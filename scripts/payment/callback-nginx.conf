# Replace only the upstream/TLS paths in a private generated copy. Never add payload logging.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64k;
        location ~ "^/app-api/order/notify/wechat-v3/[A-Za-z0-9_-]{1,32}$" {
            proxy_pass http://host.docker.internal:48081;
            proxy_http_version 1.1;
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_intercept_errors off;
            proxy_next_upstream off;
            proxy_request_buffering off;
        }
        # Local diagnostics retain application authentication; not a public deployment route.
        location /admin-api/pay/live-preflight/ {
            proxy_pass http://host.docker.internal:48081;
            proxy_set_header Host $host;
            proxy_intercept_errors off;
            proxy_next_upstream off;
        }
        location /admin-api/pay/merchant-details/ {
            proxy_pass http://host.docker.internal:48081;
            proxy_set_header Host $host;
            proxy_intercept_errors off;
            proxy_next_upstream off;
        }
        location / { return 404; }
    }
}
